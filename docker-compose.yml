services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ORIGIN: https://${DOMAIN}
    volumes:
      - app-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  caddy-data:
  caddy-config:

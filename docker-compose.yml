# Runs the app behind your own reverse proxy (nginx, Traefik, Nginx Proxy Manager, ...),
# which terminates HTTPS and forwards to this container over plain HTTP.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # Public URL exactly as users open it in the browser, e.g. https://myfam.example.de.
      # Form posts from any other address are rejected, so this must match.
      ORIGIN: ${PUBLIC_URL:-http://localhost:${PORT:-3000}}
      # Automatic supermarket offers via marktguru.de (see README). Off unless set to true.
      MARKTGURU_ENABLED: ${MARKTGURU_ENABLED:-false}
      # Push reminders: keys are generated and stored in the database unless set here.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Key for the passwords of calendar subscriptions. Without it, /data/secret.key is created.
      SECRET_KEY: ${SECRET_KEY:-}
      # New accounts only through invite links, except for the very first one. true = anyone may register.
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      # Real client address from the reverse proxy, so failed logins are also counted per IP.
      ADDRESS_HEADER: ${ADDRESS_HEADER:-}
      XFF_DEPTH: ${XFF_DEPTH:-1}
      # Calendar subscriptions may only reach public addresses; list LAN hosts here (comma-separated).
      CALDAV_ALLOW_HOSTS: ${CALDAV_ALLOW_HOSTS:-}
    ports:
      # Only reachable from this host by default; set BIND=0.0.0.0 if the proxy runs elsewhere.
      - '${BIND:-127.0.0.1}:${PORT:-3000}:3000'
    volumes:
      - app-data:/data

volumes:
  app-data:
